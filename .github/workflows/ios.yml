name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    name: Проверка FFI-крейта (cargo check)
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev clang

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кеш cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi/grin-wallet-ffi

      - name: Cargo check
        working-directory: ffi/grin-wallet-ffi
        run: cargo check 2>&1 | tail -60; exit ${PIPESTATUS[0]}

  ffi-smoke:
    name: Смоук-тест FFI (macOS, оффлайн)
    runs-on: macos-15
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Кеш cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi/grin-wallet-ffi

      - name: Патчи зависимостей
        working-directory: ffi/grin-wallet-ffi
        run: |
          mkdir -p .patches
          curl -sL https://static.crates.io/crates/sysinfo/sysinfo-0.38.4.crate | tar xz -C .patches
          curl -sL https://static.crates.io/crates/grin_wallet_impls/grin_wallet_impls-5.5.1.crate | tar xz -C .patches
          python3 ../patches/patch_ios_deps.py .patches
          printf '\n[patch.crates-io]\nsysinfo = { path = ".patches/sysinfo-0.38.4" }\ngrin_wallet_impls = { path = ".patches/grin_wallet_impls-5.5.1" }\n' >> Cargo.toml

      - name: Тест жизненного цикла кошелька
        working-directory: ffi/grin-wallet-ffi
        run: cargo test --test roundtrip --test ffi_memory -- --nocapture

  rust-ios:
    name: Сборка FFI для iOS (XCFramework)
    runs-on: macos-15
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Rust toolchain + таргеты iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Кеш cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ffi/grin-wallet-ffi

      - name: Патчи зависимостей для iOS
        working-directory: ffi/grin-wallet-ffi
        run: |
          mkdir -p .patches
          curl -sL https://static.crates.io/crates/sysinfo/sysinfo-0.38.4.crate | tar xz -C .patches
          curl -sL https://static.crates.io/crates/grin_wallet_impls/grin_wallet_impls-5.5.1.crate | tar xz -C .patches
          python3 ../patches/patch_ios_deps.py .patches
          printf '\n[patch.crates-io]\nsysinfo = { path = ".patches/sysinfo-0.38.4" }\ngrin_wallet_impls = { path = ".patches/grin_wallet_impls-5.5.1" }\n' >> Cargo.toml

      - name: Сборка статических библиотек
        working-directory: ffi/grin-wallet-ffi
        # Важно: cc-зависимости (sqlite, zstd, secp256k1) должны собираться
        # с тем же deployment target, что и приложение (iOS 15),
        # иначе при финальной линковке вылезут ___chkstk_darwin и
        # «built for newer iOS version».
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios

      - name: Упаковка XCFramework
        working-directory: ffi
        run: |
          mkdir -p ios-sim
          lipo -create \
            grin-wallet-ffi/target/aarch64-apple-ios-sim/release/libgrin_wallet_ffi.a \
            grin-wallet-ffi/target/x86_64-apple-ios/release/libgrin_wallet_ffi.a \
            -output ios-sim/libgrin_wallet_ffi.a
          xcodebuild -create-xcframework \
            -library grin-wallet-ffi/target/aarch64-apple-ios/release/libgrin_wallet_ffi.a -headers include \
            -library ios-sim/libgrin_wallet_ffi.a -headers include \
            -output GrinWalletFFI.xcframework

      - name: Артефакт XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: GrinWalletFFI.xcframework
          path: ffi/GrinWalletFFI.xcframework
          retention-days: 7

  build:
    name: Сборка GrinFlint (симулятор + FFI)
    runs-on: macos-15
    needs: rust-ios
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Скачать XCFramework FFI
        uses: actions/download-artifact@v4
        with:
          name: GrinWalletFFI.xcframework
          path: ffi-artifact

      - name: Сборка (с реальным FFI)
        run: |
          XCF=ffi-artifact/GrinWalletFFI.xcframework
          # download-artifact может отдавать либо саму папку xcframework,
          # либо её содержимое — поддерживаем оба варианта.
          [ -d "$XCF" ] || XCF=ffi-artifact
          SIM_LIB=$(find "$XCF" -name 'libgrin_wallet_ffi.a' -path '*sim*' | head -1)
          HEADERS=$(find "$XCF" -type d -name Headers | head -1)
          test -n "$SIM_LIB" && test -n "$HEADERS"
          xcodebuild build \
            -project GrinFlintApp/GrinFlint.xcodeproj \
            -scheme GrinFlint \
            -derivedDataPath "$PWD/build" \
            -destination 'generic/platform=iOS Simulator' \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) GRINFFI' \
            SWIFT_OBJC_BRIDGING_HEADER="$PWD/GrinFlintApp/GrinFlint/Services/FFI/GrinWalletFFI-Bridging-Header.h" \
            HEADER_SEARCH_PATHS="$PWD/$HEADERS" \
            OTHER_LDFLAGS="-L$PWD/$(dirname "$SIM_LIB") -lgrin_wallet_ffi -framework Security -framework CoreFoundation -liconv" \
            | xcpretty && exit ${PIPESTATUS[0]}

      # Локализации, собранные в бандл (видно, есть ли ru.lproj).
      - name: Локализации в бандле
        run: |
          APP=$(find "$PWD/build/Build/Products" -maxdepth 2 -name 'GrinFlint.app' -type d | head -1)
          test -n "$APP" || { echo "GrinFlint.app не найден"; exit 1; }
          echo "app: $APP"
          ls -d "$APP"/*.lproj 2>/dev/null || echo "нет .lproj"
          for d in "$APP"/*.lproj; do
            [ -d "$d" ] || continue
            echo "--- $d ---"
            /usr/libexec/PlistBuddy -c "Print :CFBundleDevelopmentRegion" "$APP/Info.plist" 2>/dev/null || true
            head -5 "$d/Localizable.strings" 2>/dev/null || true
          done

      # Юнит-тесты Keychain и журнала незавершённых переводов.
      - name: Юнит-тесты (Keychain, журнал операций)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          XCF=ffi-artifact/GrinWalletFFI.xcframework
          [ -d "$XCF" ] || XCF=ffi-artifact
          SIM_LIB=$(find "$XCF" -name 'libgrin_wallet_ffi.a' -path '*sim*' | head -1)
          HEADERS=$(find "$XCF" -type d -name Headers | head -1)
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          test -n "$DEVICE" || { echo "симулятор не найден"; exit 1; }
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test \
            -project GrinFlintApp/GrinFlint.xcodeproj \
            -scheme GrinFlint \
            -derivedDataPath "$PWD/build" \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -only-testing:GrinFlintTests \
            -resultBundlePath "$PWD/unit.xcresult" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) GRINFFI' \
            SWIFT_OBJC_BRIDGING_HEADER="$PWD/GrinFlintApp/GrinFlint/Services/FFI/GrinWalletFFI-Bridging-Header.h" \
            HEADER_SEARCH_PATHS="$PWD/$HEADERS" \
            OTHER_LDFLAGS="-L$PWD/$(dirname "$SIM_LIB") -lgrin_wallet_ffi -framework Security -framework CoreFoundation -liconv" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Результаты юнит-тестов (xcresult)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit.xcresult
          if-no-files-found: warn
          retention-days: 7

      # XCUITest: тапы по экранам в симуляторе (демо-сервис, без сети).
      - name: UI-тесты на симуляторе (XCUITest)
        timeout-minutes: 20
        run: |
          set -euo pipefail
          XCF=ffi-artifact/GrinWalletFFI.xcframework
          [ -d "$XCF" ] || XCF=ffi-artifact
          SIM_LIB=$(find "$XCF" -name 'libgrin_wallet_ffi.a' -path '*sim*' | head -1)
          HEADERS=$(find "$XCF" -type d -name Headers | head -1)
          test -n "$SIM_LIB" && test -n "$HEADERS"
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          test -n "$DEVICE" || { echo "симулятор не найден"; exit 1; }
          echo "device: $DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test \
            -project GrinFlintApp/GrinFlint.xcodeproj \
            -scheme GrinFlint \
            -derivedDataPath "$PWD/build" \
            -destination "platform=iOS Simulator,id=$DEVICE" \
            -only-testing:GrinFlintUITests \
            -resultBundlePath "$PWD/uitest.xcresult" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) GRINFFI' \
            SWIFT_OBJC_BRIDGING_HEADER="$PWD/GrinFlintApp/GrinFlint/Services/FFI/GrinWalletFFI-Bridging-Header.h" \
            HEADER_SEARCH_PATHS="$PWD/$HEADERS" \
            OTHER_LDFLAGS="-L$PWD/$(dirname "$SIM_LIB") -lgrin_wallet_ffi -framework Security -framework CoreFoundation -liconv" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Результаты UI-тестов (xcresult)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-results
          path: uitest.xcresult
          if-no-files-found: warn
          retention-days: 7

      # Реальный запуск на симуляторе: приложение стартует с `-SimSmoke`
      # и прогоняет Keychain → FFI → seed → open → refresh → восстановление.
      - name: Смоук на симуляторе (запуск app + FFI)
        timeout-minutes: 15
        run: |
          set -euo pipefail
          APP=$(find "$PWD/build/Build/Products" -maxdepth 2 -name 'GrinFlint.app' -type d | head -1)
          test -n "$APP" || { echo "GrinFlint.app не найден"; exit 1; }
          echo "app: $APP"
          echo "--- локализации в бандле ---"
          ls -d "$APP"/*.lproj 2>/dev/null || echo "нет .lproj"
          # Share Extension должна быть встроена в приложение.
          test -d "$APP/PlugIns/GrinFlintShare.appex" || { echo "нет встроенного Share Extension"; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :NSExtension:NSExtensionPointIdentifier" \
            "$APP/PlugIns/GrinFlintShare.appex/Info.plist"
          DEVICE=$(xcrun simctl list devices available | grep -m1 -E 'iPhone' | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          test -n "$DEVICE" || { echo "доступный симулятор не найден"; exit 1; }
          echo "device: $DEVICE"
          # Keychain в симуляторе работает только у подписанного приложения.
          # Штатная сборка Xcode для симулятора подписывает ad-hoc сама;
          # если подписи нет — подписываем локально перед установкой.
          if codesign -dv "$APP" >/dev/null 2>&1; then
            echo "подпись есть:"; codesign -dv "$APP" 2>&1 | head -5
          else
            echo "подписи нет — подписываем ad-hoc"
            codesign --force --sign - --entitlements "$PWD/GrinFlintApp/SimulatorEntitlements.plist" "$APP"
            codesign -dv "$APP" 2>&1 | head -5
          fi
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          if ! xcrun simctl launch "$DEVICE" com.dan.grinflint -SimSmoke; then
            echo "launch не удался; хвост лога симулятора:"
            xcrun simctl spawn "$DEVICE" log show --last 3m --style compact \
              --predicate 'process == "SpringBoard" OR process == "GrinFlint"' | tail -120 || true
            exit 1
          fi
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.dan.grinflint data)
          OUT="$DATA/Documents/sim-smoke.json"
          for _ in $(seq 1 90); do
            if [ -f "$OUT" ]; then break; fi
            sleep 2
          done
          if [ ! -f "$OUT" ]; then
            echo "результата нет: $OUT"
            xcrun simctl spawn "$DEVICE" log show --last 5m --style compact \
              --predicate 'process == "GrinFlint"' | tail -80 || true
            exit 1
          fi
          echo "--- sim-smoke.json ---"
          cat "$OUT"
          grep -q '"ok" *: *true' "$OUT" || { echo "смоук не прошёл"; exit 1; }

          # --- Скриншоты реальных экранов ---
          # Флаги передаются аргументами запуска: UserDefaults читает их из
          # домена аргументов, поэтому настройки не пишутся на диск.
          # `-simDemo` подменяет сервис демо-данными (кадры дизайна),
          # `-simOpen` сразу открывает нужный экран.
          mkdir -p "$PWD/screenshots"
          shot() { # $1 — имя файла; дальше — аргументы запуска
            local name="$1"; shift
            xcrun simctl terminate "$DEVICE" com.dan.grinflint >/dev/null 2>&1 || true
            xcrun simctl launch "$DEVICE" com.dan.grinflint "$@" -simResetState -AppleLanguages '(ru)' -AppleLocale ru_RU >/dev/null
            sleep 6
            xcrun simctl io "$DEVICE" screenshot "$PWD/screenshots/$name.png"
            echo "снят $name.png"
          }
          shot onboarding
          shot portfolio-real -walletExists YES
          shot portfolio-demo -walletExists YES -simDemo
          shot send -walletExists YES -simDemo -simOpen send
          shot receive -walletExists YES -simDemo -simOpen receive
          shot transactions -walletExists YES -simDemo -simOpen transactions
          shot settings -walletExists YES -simDemo -simOpen settings
          shot auth-prompt -requireBiometrics YES
          xcrun simctl terminate "$DEVICE" com.dan.grinflint >/dev/null 2>&1 || true

          # --- Проверка URL scheme grinslate:// ---
          xcrun simctl launch "$DEVICE" com.dan.grinflint -walletExists YES -simDemo -AppleLanguages '(ru)' -AppleLocale ru_RU >/dev/null
          sleep 3
          xcrun simctl openurl "$DEVICE" "grinslate://receive?text=BEGINSLATEPACK.test"
          sleep 4
          xcrun simctl io "$DEVICE" screenshot "$PWD/screenshots/url-scheme-prompt.png"
          echo "снят url-scheme-prompt.png"
          xcrun simctl terminate "$DEVICE" com.dan.grinflint >/dev/null 2>&1 || true
          ls -la "$PWD/screenshots"
          echo "--- паники/ошибки приложения в логе симулятора ---"
          xcrun simctl spawn "$DEVICE" log show --last 10m --style compact \
            --predicate 'process == "GrinFlint"' 2>/dev/null | grep -i -E 'panic|fatal' | tail -30 || true

      - name: Артефакт скриншотов
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sim-screenshots
          path: screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
  # Неподписанный Release archive для устройства: CI отдаёт артефакт,
  # подпись Personal Team и установка выполняются на Mac владельца.
  device-archive:
    name: Device Release archive (FFI, без подписи)
    runs-on: macos-15
    needs: rust-ios
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Скачать XCFramework FFI
        uses: actions/download-artifact@v4
        with:
          name: GrinWalletFFI.xcframework
          path: ffi-artifact

      - name: Архив для устройства (Release, подпись отключена)
        run: |
          set -euo pipefail
          XCF=ffi-artifact/GrinWalletFFI.xcframework
          [ -d "$XCF" ] || XCF=ffi-artifact
          DEVICE_LIB=$(find "$XCF" -name 'libgrin_wallet_ffi.a' | grep -v -i sim | head -1)
          HEADERS=$(find "$XCF" -type d -name Headers | head -1)
          test -n "$DEVICE_LIB" || { echo "нет device-слайса XCFramework"; exit 1; }
          test -n "$HEADERS" || { echo "нет заголовков FFI"; exit 1; }
          xcodebuild archive \
            -project GrinFlintApp/GrinFlint.xcodeproj \
            -scheme GrinFlint \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/GrinFlint.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) GRINFFI' \
            SWIFT_OBJC_BRIDGING_HEADER="$PWD/GrinFlintApp/GrinFlint/Services/FFI/GrinWalletFFI-Bridging-Header.h" \
            HEADER_SEARCH_PATHS="$PWD/$HEADERS" \
            OTHER_LDFLAGS="-L$PWD/$(dirname "$DEVICE_LIB") -lgrin_wallet_ffi -framework Security -framework CoreFoundation -liconv" \
            | xcpretty && exit ${PIPESTATUS[0]}

      - name: Проверка архива и BUILD-INFO
        run: |
          set -euo pipefail
          A="$PWD/build/GrinFlint.xcarchive"
          test -d "$A" || { echo "archive не создан"; exit 1; }
          APP="$A/Products/Applications/GrinFlint.app"
          test -d "$APP" || { echo "app в архиве не найден"; exit 1; }
          test -d "$APP/PlugIns/GrinFlintShare.appex" || { echo "Share Extension не встроен"; exit 1; }
          file "$APP/GrinFlint" | grep -q 'arm64' || { echo "бинарник не arm64"; exit 1; }
          {
            echo "commit: ${GITHUB_SHA}"
            echo "run: ${GITHUB_RUN_ID}"
            xcodebuild -version
          } > "$A/BUILD-INFO.txt"
          cat "$A/BUILD-INFO.txt"
          cd build
          zip -qry GrinFlint.xcarchive.zip GrinFlint.xcarchive
          shasum -a 256 GrinFlint.xcarchive.zip | tee GrinFlint.xcarchive.zip.sha256

      - name: Артефакт device-архива
        uses: actions/upload-artifact@v4
        with:
          name: device-archive
          path: |
            build/GrinFlint.xcarchive.zip
            build/GrinFlint.xcarchive.zip.sha256
            build/GrinFlint.xcarchive/BUILD-INFO.txt
          retention-days: 30