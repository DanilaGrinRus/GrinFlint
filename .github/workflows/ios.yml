name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    name: Проверка FFI-крейта (cargo check)
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev clang

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: ffi/grin-wallet-ffi
        run: cargo check 2>&1 | tail -60; exit ${PIPESTATUS[0]}

  ffi-smoke:
    name: Смоук-тест FFI (macOS, оффлайн)
    runs-on: macos-15
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Патчи зависимостей
        working-directory: ffi/grin-wallet-ffi
        run: |
          mkdir -p .patches
          curl -sL https://static.crates.io/crates/sysinfo/sysinfo-0.38.4.crate | tar xz -C .patches
          curl -sL https://static.crates.io/crates/grin_wallet_impls/grin_wallet_impls-5.5.1.crate | tar xz -C .patches
          python3 ../patches/patch_ios_deps.py .patches
          printf '\n[patch.crates-io]\nsysinfo = { path = ".patches/sysinfo-0.38.4" }\ngrin_wallet_impls = { path = ".patches/grin_wallet_impls-5.5.1" }\n' >> Cargo.toml

      - name: Тест жизненного цикла кошелька
        working-directory: ffi/grin-wallet-ffi
        run: cargo test --test roundtrip -- --nocapture

  rust-ios:
    name: Сборка FFI для iOS (XCFramework)
    runs-on: macos-15
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Rust toolchain + таргеты iOS
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - name: Патчи зависимостей для iOS
        working-directory: ffi/grin-wallet-ffi
        run: |
          mkdir -p .patches
          curl -sL https://static.crates.io/crates/sysinfo/sysinfo-0.38.4.crate | tar xz -C .patches
          curl -sL https://static.crates.io/crates/grin_wallet_impls/grin_wallet_impls-5.5.1.crate | tar xz -C .patches
          python3 ../patches/patch_ios_deps.py .patches
          printf '\n[patch.crates-io]\nsysinfo = { path = ".patches/sysinfo-0.38.4" }\ngrin_wallet_impls = { path = ".patches/grin_wallet_impls-5.5.1" }\n' >> Cargo.toml

      - name: Сборка статических библиотек
        working-directory: ffi/grin-wallet-ffi
        # Важно: cc-зависимости (sqlite, zstd, secp256k1) должны собираться
        # с тем же deployment target, что и приложение (iOS 15),
        # иначе при финальной линковке вылезут ___chkstk_darwin и
        # «built for newer iOS version».
        env:
          IPHONEOS_DEPLOYMENT_TARGET: "15.0"
        run: |
          cargo build --release --target aarch64-apple-ios
          cargo build --release --target aarch64-apple-ios-sim
          cargo build --release --target x86_64-apple-ios

      - name: Упаковка XCFramework
        working-directory: ffi
        run: |
          mkdir -p ios-sim
          lipo -create \
            grin-wallet-ffi/target/aarch64-apple-ios-sim/release/libgrin_wallet_ffi.a \
            grin-wallet-ffi/target/x86_64-apple-ios/release/libgrin_wallet_ffi.a \
            -output ios-sim/libgrin_wallet_ffi.a
          xcodebuild -create-xcframework \
            -library grin-wallet-ffi/target/aarch64-apple-ios/release/libgrin_wallet_ffi.a -headers include \
            -library ios-sim/libgrin_wallet_ffi.a -headers include \
            -output GrinWalletFFI.xcframework

      - name: Артефакт XCFramework
        uses: actions/upload-artifact@v4
        with:
          name: GrinWalletFFI.xcframework
          path: ffi/GrinWalletFFI.xcframework
          retention-days: 7

  build:
    name: Сборка GrinFlint (симулятор + FFI)
    runs-on: macos-15
    needs: rust-ios
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Скачать XCFramework FFI
        uses: actions/download-artifact@v4
        with:
          name: GrinWalletFFI.xcframework
          path: ffi-artifact

      - name: Сборка (с реальным FFI)
        run: |
          XCF=ffi-artifact/GrinWalletFFI.xcframework
          # download-artifact может отдавать либо саму папку xcframework,
          # либо её содержимое — поддерживаем оба варианта.
          [ -d "$XCF" ] || XCF=ffi-artifact
          SIM_LIB=$(find "$XCF" -name 'libgrin_wallet_ffi.a' -path '*sim*' | head -1)
          HEADERS=$(find "$XCF" -type d -name Headers | head -1)
          test -n "$SIM_LIB" && test -n "$HEADERS"
          xcodebuild build \
            -project GrinFlintApp/GrinFlint.xcodeproj \
            -scheme GrinFlint \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_ACTIVE_COMPILATION_CONDITIONS='$(inherited) GRINFFI' \
            SWIFT_OBJC_BRIDGING_HEADER="$PWD/GrinFlintApp/GrinFlint/Services/FFI/GrinWalletFFI-Bridging-Header.h" \
            HEADER_SEARCH_PATHS="$PWD/$HEADERS" \
            OTHER_LDFLAGS="-L$PWD/$(dirname "$SIM_LIB") -lgrin_wallet_ffi -framework Security -framework CoreFoundation -liconv" \
            | xcpretty && exit ${PIPESTATUS[0]}
