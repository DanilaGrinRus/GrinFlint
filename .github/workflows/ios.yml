name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Сборка GrinFlint (симулятор)
    runs-on: macos-15
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Сборка
        run: |
          xcodebuild build \
            -project GrinFlintApp/GrinFlint.xcodeproj \
            -scheme GrinFlint \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
