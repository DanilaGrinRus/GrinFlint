name: iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust-check:
    name: Проверка FFI-крейта (cargo check)
    runs-on: ubuntu-latest
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Зависимости сборки
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libssl-dev clang

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo check
        working-directory: ffi/grin-wallet-ffi
        run: cargo check 2>&1 | tail -60

  build:
    name: Сборка GrinFlint (симулятор)
    runs-on: macos-15
    steps:
      - name: Клонирование
        uses: actions/checkout@v4

      - name: Версия Xcode
        run: xcodebuild -version

      - name: Сборка
        run: |
          xcodebuild build \
            -project GrinFlintApp/GrinFlint.xcodeproj \
            -scheme GrinFlint \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty && exit ${PIPESTATUS[0]}
