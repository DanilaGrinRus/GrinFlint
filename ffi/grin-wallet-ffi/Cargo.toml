[package]
name = "grin-wallet-ffi"
version = "0.1.0"
edition = "2021"
description = "C-обёртка (FFI) над grin-wallet v5.5.x для iOS/Swift"
license = "Apache-2.0"

[lib]
# staticlib — для XCFramework; rlib — чтобы работали интеграционные тесты
# (tests/roundtrip.rs собирается на macOS-хосте в CI).
crate-type = ["staticlib", "rlib"]

[dependencies]
grin_wallet_api = "=5.5.1"
grin_wallet_libwallet = "=5.5.1"
grin_wallet_impls = "=5.5.1"
grin_wallet_config = "=5.5.1"
grin_wallet_util = "=5.5.1"
grin_core = "5.5.1"
grin_keychain = "5.5.1"
grin_util = "5.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.5"
uuid = "1"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 2

# Отсоединяет крейт от родительского workspace (локально Cargo иначе
# находит чужой C:\DHW\Cargo.toml и отказывается собирать).
[workspace]
